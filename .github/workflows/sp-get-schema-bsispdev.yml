---
name: Get SharePoint Schema from DEV
permissions:
  contents: write
  id-token: write
on:
  workflow_call:
    inputs:
      arguments:
        description: 'Optional arguments to pass to the extract such as -Handlers All (lists are default)'
        required: false
        default: '-Handlers Lists'
        type: string
      solutionname:
        required: true
        type: string
      siteurl:
        required: true
        type: string

     
env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b

jobs:
  export-solution:
    name: Export Schema
    runs-on: ubuntu-latest

    steps:
        # Install PnP
      - name: Install PowerShell and PnP PowerShell
        id: install_pnp
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh -Command "Install-Module PnP.PowerShell -Force -Scope CurrentUser"

        # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: checkout_repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
  
        # Azure login (OIDC)
      - name: Az CLI login
        id: az_login
        uses: azure/login@v2
        with:
            # these need to be EDF items. Do not need to store as variables, are constant. Are not secrets
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          allow-no-subscriptions: true

        # check sharepointconfig folder
      - name: Check Solution folder
        id: check_folders
        run: |
            mkdir -p sharepointconfig
        
        #connect pnp and get schema 
      - name: Export SharePoint PnP site template
        id: export_sitetemplate
        shell: pwsh
        run: |
          $arguments = "${{ inputs.arguments }}"

          # default if empty
          if ([string]::IsNullOrWhiteSpace($arguments)) {
              $handlers = @("Lists")
          } else {
              # very simple split (assumes format: "-Handlers Lists,Pages,ContentTypes")
              if ($arguments -match "-Handlers\s+(.+)") {
                  $handlers = $matches[1] -split ','
              }
          }
          
          Write-Host "Using handlers: $handlers"
          $token = az account get-access-token --resource https://bsispdev.sharepoint.com --query accessToken -o tsv
          Connect-PnPOnline -Url ${{ inputs.siteurl }} -AccessToken $token
          Get-PnPSiteTemplate -Out "./sharepointconfig/${{ inputs.solutionname }}.xml" -Handlers $handlers -Force

        # install xml tooling
      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet

        # update PnP file
      - name: Update XML IDs
        run: |
          FILE="./sharepointconfig/${{ inputs.solutionname }}.xml"
      
          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -u "//pnp:Templates/@ID" -v "CONTAINER-${{ inputs.solutionname }}" \
            -u "//pnp:ProvisioningTemplate/@ID" -v "TEMPLATE-${{ inputs.solutionname }}" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ListInstance[@Title='Site Pages']" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ListInstance[@Title='Version Lookup List']" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ListInstance[@Title='SForm Templates']" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ListInstance[@Title='Site Assets]" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ListInstance[@Title='Style Library']" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ProvisioningTemplate/@BaseSiteTemplate" \
            "$FILE"

          xmlstarlet ed -L \
            -N pnp="http://schemas.dev.office.com/PnP/2022/09/ProvisioningSchema" \
            -d "//pnp:ProvisioningTemplate/@Scope" \
            "$FILE"
            
        # commit the changes
      - name: Commit changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update SharePoint schema file"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # push to the repo
      - name: Push changes
        id: push_repo
        if: success()
        run: git push origin HEAD
