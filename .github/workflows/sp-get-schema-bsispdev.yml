---
name: Get SharePoint Schema from DEV
permissions:
  contents: write
  id-token: write
on:
  workflow_call:
    inputs:
      arguments:
        description: 'Optional arguments to pass to the extract such as -Handlers Lists'
        required: false
        type: string
      solutionname:
        required: true
        type: string
      siteurl:
        required: true
        type: string

     
env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b

jobs:
  export-solution:
    name: Export Schema
    runs-on: ubuntu-latest

    steps:
        # Install PnP
      - name: Install PowerShell and PnP PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh -Command "Install-Module PnP.PowerShell -Force -Scope CurrentUser"

        # check sharepointconfig folder
      - name: Check Solution folder
        run: |
            mkdir -p sharepointconfig
        
        # azure login
      - name: 'Az CLI login'
        uses: azure/login@8c334a195cbb38e46038007b304988d888bf676a
        with:
          client-id: ${{ env.AZ_CLIENT_ID}}
          tenant-id: $${{ env.AZ_TENANT_ID}}
          allow-no-subscriptions: true
        
        #connect pnp and get schema 
      - name: Export SharePoint PnP site template (secure cert)
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://bsispdev.sharepoint.com --query accessToken -o tsv
          Connect-PnPOnline -Url ${{ inputs.siteurl }} -AccessToken $token

          Get-PnPWeb ${{ inputs.arguments }} -Out ./sharepointconfig/${{ inputs.solutionname }}.xml

        # commit the changes
      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git status
          git diff --stat
          git commit -m "Automated extract of ${{ inputs.solutionname }}"

      # push to the repo
      - name: Push changes
        if: success()
        run: git push origin HEAD