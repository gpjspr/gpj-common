---
name: Get SharePoint Schema from DEV
permissions:
  contents: write
  id-token: write
on:
  workflow_call:
    inputs:
      arguments:
        description: 'Optional arguments to pass to the extract such as -Handlers Lists'
        required: false
        type: string
      solutionname:
        required: true
        type: string
      siteurl:
        required: true
        type: string

     
env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b

jobs:
  export-solution:
    name: Export Schema
    runs-on: ubuntu-latest

    steps:
        # Install PnP
      - name: Install PowerShell and PnP PowerShell
        id: install_pnp
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell
          pwsh -Command "Install-Module PnP.PowerShell -Force -Scope CurrentUser"

        # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: checkout_repo
        uses: actions/checkout@v4
  
        # Azure login (OIDC)
      - name: Az CLI login
        id: az_login
        uses: azure/login@v2
        with:
            # these need to be EDF items. Do not need to store as variables, are constant. Are not secrets
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          allow-no-subscriptions: true

        # check sharepointconfig folder
      - name: Check Solution folder
        id: check_folders
        run: |
            mkdir -p sharepointconfig
        
        #connect pnp and get schema 
      - name: Export SharePoint PnP site template
        id: export_sitetemplate
        shell: pwsh
        run: |
          $token = az account get-access-token --resource https://bsispdev.sharepoint.com --query accessToken -o tsv
          Connect-PnPOnline -Url ${{ inputs.siteurl }} -AccessToken $token

          Get-PnPSiteTemplate ${{ inputs.arguments }} -Out ./sharepointconfig/${{ inputs.solutionname }}.xml -Force

        # commit the changes
      - name: Commit changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git status
          git diff --stat
          git commit -m "Automated extract of ${{ inputs.solutionname }}"

      # push to the repo
      - name: Push changes
        id: push_repo
        if: success()
        run: git push origin HEAD