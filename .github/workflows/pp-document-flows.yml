---
name: Generate Flow Diagrams

on:
  workflow_call:
    inputs:
      flow-path:
        required: true
        type: string
      output-path:
        required: false
        default: flow-diagrams
        type: string

jobs:
  generate:
    name: Generate Flow Diagrams
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4

      - name: Checkout common repo (scripts)
        uses: actions/checkout@v4
        with:
          repository: your-org/common-repo
          path: common

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xmlstarlet

      - name: Run generator
        run: |
          chmod +x common/.github.utilities/generate-diagrams.sh
          common/scripts/generate-diagrams.sh \
            "${{ inputs.flow-path }}" \
            "${{ inputs.output-path }}"

      - name: Commit diagrams
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${{ inputs.output-path }}"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate flow diagrams"
            git push
          fi
