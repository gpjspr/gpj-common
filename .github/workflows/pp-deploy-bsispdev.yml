---
name: Deploy solution
permissions:
  contents: write
  id-token: write
on:
  workflow_call:
    inputs:
      solutionname:
        required: true
        type: string
      pp_env_url:
        description:  'Power Platfrom environment URL'
        required: true
        type: string
env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1
      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"
      # build solution
      - name: Build Solution
        id: build_managed
        run: |
          pac solution pack --zipfile "./out/${{ inputs.solutionname }}.zip" \
          --folder "./src/solutions/${{ inputs.solutionname }}" \
          --packagetype managed

      - name: Upload solution as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solutionname }}-solution
          path: ./out/${{ inputs.solutionname }}.zip

      - name: Add summary
        run: |
          echo "### ✅ Solution packaged" >> $GITHUB_STEP_SUMMARY
          echo "- File: ${{ inputs.solutionname }}.zip" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4

      # get branch and config
      - name: Determine Environment from Branch
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ $BRANCH == test/* ]]; then
            ENV_NAME="TEST"
          elif [[ $BRANCH == uat/* ]]; then
            ENV_NAME="UAT"
          elif [[ $BRANCH == releases/* ]]; then
            ENV_NAME="PROD"
          else
            echo "### 🟠 Invalid branch. Must be test/*, uat/* or releases/* " >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
      - name: Load Environment Config
        id: config
        run: |
          ENV_NAME=${{ steps.env.outputs.env_name }}
          CONFIG_PATH="configuration/$ENV_NAME/${{ inputs.solutionname }}-settings.json"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "### 🟠 Configuration file not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "deployment_settings=$CONFIG_PATH" >> $GITHUB_OUTPUT

          echo "### Deploying ${{ inputs.solutionname }} to ${{ inputs.pp_env_url }} " >> $GITHUB_STEP_SUMMARY
          echo "### Using configuration file $CONFIG_PATH" >> $GITHUB_STEP_SUMMARY
      - name: Download solution artifact
        id: download-solution
        continue-on-error: false
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.solutionname }}-solution
          path: ./artifact/
      # Azure login (OIDC)
      - name: Az CLI login
        id: az_authentiate
        uses: azure/login@v2
        with:
            # these need to be EDF items. Do not need to store as variables, are constant. Are not secrets
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          allow-no-subscriptions: true

      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1
      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"

      # Authenticate to Power Platform
      - name: PAC federated
        id: pac_authenticate
        shell: bash
        run: |
          pac auth create \
            --name "pacfed" \
            --githubFederated \
            --tenant ${{ env.AZ_TENANT_ID }} \
            --applicationId ${{ env.AZ_CLIENT_ID }} \
            --environment ${{ inputs.pp_env_url }}
          pac auth who

      # Is the solution already installed in the target environment?
      # Holding-import (staged upgrade) only works when a base solution exists.
      - name: Check if solution already installed
        id: solcheck
        run: |
          INSTALLED=$(pac solution list --environment "${{ inputs.pp_env_url }}" --json \
            | jq -r '.[] | select(.SolutionUniqueName=="${{ inputs.solutionname }}") | .SolutionUniqueName')
          if [ -n "$INSTALLED" ]; then
            echo "installed=true" >> $GITHUB_OUTPUT
            echo "### ℹ️ Existing solution found - will stage as a holding upgrade" >> $GITHUB_STEP_SUMMARY
          else
            echo "installed=false" >> $GITHUB_OUTPUT
            echo "### ℹ️ No existing solution - first-time install (cannot stage, imports directly)" >> $GITHUB_STEP_SUMMARY
          fi

      # Stage the import.
      #  - existing solution  -> import as HOLDING (does NOT affect the live solution; surfaces errors)
      #  - first-time install -> no holding possible, so this performs the real import
      - name: Stage Deployment
        id: stage
        continue-on-error: true
        run: |
          set -o pipefail

          if [ "${{ steps.solcheck.outputs.installed }}" = "true" ]; then
            echo "Staging as holding solution (upgrade not yet applied)..."
            pac solution import \
              --path "./artifact/${{ inputs.solutionname }}.zip" \
              --environment "${{ inputs.pp_env_url }}" \
              --settings-file "${{ steps.config.outputs.deployment_settings }}" \
              --import-as-holding true \
              --publish-changes false \
              --async false \
              2>&1 | tee import.log
          else
            echo "First-time install - importing directly (no holding stage available)..."
            pac solution import \
              --path "./artifact/${{ inputs.solutionname }}.zip" \
              --environment "${{ inputs.pp_env_url }}" \
              --settings-file "${{ steps.config.outputs.deployment_settings }}" \
              --publish-changes true \
              --async false \
              2>&1 | tee import.log
          fi

          # Capture the pac exit code (NOT the echo/tee that follows)
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          echo "### 🔍 Stage completed. Checking result..." >> $GITHUB_STEP_SUMMARY

      - name: Analyse Deployment Errors
        id: analyse
        if: always()
        run: |
          LOG=import.log
          HAS_ERROR=0

          echo "## 🚀 Deployment Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # -------------------------------
          # Missing Dependencies
          # -------------------------------
          if grep -q "<MissingDependencies" $LOG; then
            echo "### ❌ Deployment blocked: missing dependencies detected" >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Version downgrade
          # -------------------------------
          if grep -qi "version.*lower" $LOG || grep -qi "cannot import.*older version" $LOG; then
            echo "### ❌ Deployment blocked: version number is lower than current installed version" >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Managed/Unmanaged conflict
          # -------------------------------
          if grep -qi "managed.*cannot be imported as unmanaged" $LOG; then
            echo "### ❌ Deployment blocked: managed/unmanaged solution conflict" >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Publisher mismatch
          # -------------------------------
          if grep -qi "publisher" $LOG && grep -qi "mismatch" $LOG; then
            echo "### ❌ Deployment blocked: publisher mismatch detected" >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Missing connection reference (fallback text detection)
          # -------------------------------
          if grep -qi "connectionreference" $LOG && grep -qi "missing" $LOG; then
            echo "### ❌ Deployment blocked: missing connection references" >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Generic failure fallback
          # -------------------------------
          if [ "$HAS_ERROR" -eq 0 ] && grep -qi "error" $LOG; then
            echo "### ❌ Deployment failed: unknown error" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Extract:" >> $GITHUB_STEP_SUMMARY
            grep -i "error" $LOG | head -20 >> $GITHUB_STEP_SUMMARY
            HAS_ERROR=1
          fi

          # -------------------------------
          # Success
          # -------------------------------
          if [ "$HAS_ERROR" -eq 0 ]; then
            echo "### ✅ No blocking deployment issues detected" >> $GITHUB_STEP_SUMMARY
          fi

          # Save result
          echo "has_error=$HAS_ERROR" >> $GITHUB_OUTPUT

      # Stop here if staging failed or the log analysis found problems.
      # For an existing solution the holding solution is NOT applied, so the
      # live solution is untouched and no upgrade is promoted.
      - name: Fail if validation failed
        id: fail_notvalid
        if: steps.stage.outputs.exit_code != '0' || steps.analyse.outputs.has_error == '1'
        run: |
          echo "### ❌ Deployment blocked - upgrade NOT applied" >> $GITHUB_STEP_SUMMARY
          echo "::error title=Deployment Blocked::Validation failed (dependencies or import errors)"
          exit 1

      # Promote the staged holding solution (existing solution path only).
      - name: Apply Upgrade (promote holding solution)
        id: apply_upgrade
        if: steps.solcheck.outputs.installed == 'true' && steps.stage.outputs.exit_code == '0' && steps.analyse.outputs.has_error == '0'
        run: |
          set -o pipefail

          pac solution upgrade \
            --solution-name "${{ inputs.solutionname }}" \
            --environment "${{ inputs.pp_env_url }}" \
            --async false \
            2>&1 | tee upgrade.log

          echo "### ✅ Upgrade applied to ${{ inputs.pp_env_url }}" >> $GITHUB_STEP_SUMMARY

      # First-time install path - the import in the Stage step already deployed it.
      - name: Confirm first-time install
        id: confirm_install
        if: steps.solcheck.outputs.installed == 'false' && steps.stage.outputs.exit_code == '0' && steps.analyse.outputs.has_error == '0'
        run: |
          echo "### ✅ Solution imported (first-time install) to ${{ inputs.pp_env_url }}" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------
      # Cleanup: remove the orphaned holding solution if the upgrade was
      # NOT applied successfully. A staged "{solution}_Upgrade" that is left
      # behind disables flows and blocks all future imports (manual + ALM)
      # until it is deleted, so this must run on every failure path.
      #
      # Runs when:  upgrade path (solution already existed)  AND  the apply
      #             step did not succeed (staging failed, analysis blocked
      #             it, or the upgrade itself failed / was cancelled).
      # Skips when: apply succeeded (holding already consumed) or first-time
      #             install (no holding solution is ever created).
      # ------------------------------------------------------------------
      - name: Remove orphaned holding solution on failure
        id: cleanup_holding
        if: always() && steps.solcheck.outputs.installed == 'true' && steps.apply_upgrade.outcome != 'success'
        continue-on-error: true
        run: |
          HOLDING="${{ inputs.solutionname }}_Upgrade"
          echo "Checking for orphaned holding solution: $HOLDING"

          EXISTS=$(pac solution list --environment "${{ inputs.pp_env_url }}" --json \
            | jq -r --arg n "$HOLDING" '.[] | select(.SolutionUniqueName==$n) | .SolutionUniqueName')

          if [ -n "$EXISTS" ]; then
            echo "::warning::Deleting orphaned holding solution $HOLDING to unblock the environment"

            # A failed import can leave the holding solution locked for a short
            # while. Retry the delete a few times with a back-off before giving up.
            MAX_ATTEMPTS=5
            DELAY=20
            DELETED=0

            for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
              echo "Delete attempt $ATTEMPT of $MAX_ATTEMPTS..."
              if pac solution delete \
                   --solution-name "$HOLDING" \
                   --environment "${{ inputs.pp_env_url }}"; then
                DELETED=1
                break
              fi

              # Re-check existence - a previous attempt may have succeeded even if pac returned non-zero
              STILL_THERE=$(pac solution list --environment "${{ inputs.pp_env_url }}" --json \
                | jq -r --arg n "$HOLDING" '.[] | select(.SolutionUniqueName==$n) | .SolutionUniqueName')
              if [ -z "$STILL_THERE" ]; then
                echo "Holding solution no longer present - treating as deleted."
                DELETED=1
                break
              fi

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "Delete failed (solution may still be locked). Waiting ${DELAY}s before retry..."
                sleep "$DELAY"
              fi
            done

            if [ "$DELETED" -eq 1 ]; then
              echo "### 🧹 Removed orphaned holding solution \`$HOLDING\`" >> $GITHUB_STEP_SUMMARY
              echo "The environment has been returned to its previous state - re-run the deployment once the issue is fixed." >> $GITHUB_STEP_SUMMARY
            else
              echo "::error::Failed to delete holding solution $HOLDING after $MAX_ATTEMPTS attempts"
              echo "### ⛔ Could not remove holding solution \`$HOLDING\`" >> $GITHUB_STEP_SUMMARY
              echo "Manual action required: delete \`$HOLDING\` from ${{ inputs.pp_env_url }} before the next import." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No holding solution present - nothing to clean up."
            echo "### ℹ️ No orphaned holding solution found" >> $GITHUB_STEP_SUMMARY
          fi
