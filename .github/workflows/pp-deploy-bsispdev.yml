---
name: Deploy solution
permissions:
  contents: write
  id-token: write

on:
  workflow_call:
    inputs:
      solutionname:
        required: true
        type: string
      pp_env_url:
        description:  'Power Platfrom environment URL'
        required: true
        type: string

env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4

      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"

      # build solution
      - name: Build Solution
        id: build_managed
        run: |
          pac solution pack --zipfile "./out/${{ inputs.solutionname }}.zip" \
          --folder "./src/solutions/${{ inputs.solutionname }}" \
          --packagetype managed
          
      - name: Upload solution as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solutionname }}-solution
          path: ./out/${{ inputs.solutionname }}.zip
          
      - name: Add summary
        run: |
          echo "### ✅ Solution packaged" >> $GITHUB_STEP_SUMMARY
          echo "- File: UkCustomsApp.zip" >> $GITHUB_STEP_SUMMARY
        
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4
        
      # get branch and config
      - name: Determine Environment from Branch
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          if [[ $BRANCH == test/* ]]; then
            ENV_NAME="TEST"
          elif [[ $BRANCH == uat/* ]]; then
            ENV_NAME="UAT"
          elif [[ $BRANCH == releases/* ]]; then
            ENV_NAME="PROD"
          else
            echo "### 🟠 Invalid branch. Must be test/*, uat/* or releases/* " >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

      - name: Load Environment Config
        id: config
        run: |
          ENV_NAME=${{ steps.env.outputs.env_name }}
          CONFIG_PATH="configuration/$ENV_NAME/${{ inputs.solutionname }}-settings.json"

          if [ ! -f "$CONFIG_PATH" ]; then
            echo "### 🟠 Configuration file not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "deployment_settings=$CONFIG_PATH" >> $GITHUB_OUTPUT
          
          echo "### Deploying ${{ inputs.solutionname }} to ${{ inputs.pp_env_url }} " >> $GITHUB_STEP_SUMMARY
          echo "### Using configuration file CONFIG_PATH" >> $GITHUB_STEP_SUMMARY

      - name: Download solution artifact
        id: download-solution
        continue-on-error: false
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.solutionname }}-solution
          path: ./artifact/

      # Azure login (OIDC)
      - name: Az CLI login
        id: az_authentiate
        uses: azure/login@v2
        with:
            # these need to be EDF items. Do not need to store as variables, are constant. Are not secrets
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          allow-no-subscriptions: true
     
      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"
       
      #Authenticate to Power Platform
      - name: PAC federated
        id: pac_authenticate
        shell: bash
        run: |
          pac auth create \
            --name "pacfed" \
            --githubFederated \
            --tenant ${{ env.AZ_TENANT_ID }} \
            --applicationId ${{ env.AZ_CLIENT_ID }} \
            --environment ${{ inputs.pp_env_url }}
          pac auth who
        
      # Import solution
      - name: PAC import
        continue-on-error: true
        id: pac_import
        shell: bash
        run: |
          pac solution import \
            --path ./artifact/${{ inputs.solutionname }}.zip \
            --environment ${{ inputs.pp_env_url }} \
            2>&1 | tee import.log
            
      #any dependencies      
      - name: Extract Missing Dependencies
        if: always()
        run: |
          sed -n '/<MissingDependencies/,/<\/MissingDependencies>/p' import.log > missing.xml || true
      
          if [ ! -s missing.xml ]; then
            echo "### ✅ No missing dependencies found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
      #install xmllint
      - name: Install xmllint
        id: install_xmllint_extract
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # normalise xml
      - name: Normalize XML
        run: |
          echo "<root>" > fixed.xml
          cat missing.xml >> fixed.xml
          echo "</root>" >> fixed.xml

      # capture errors
      - name: Parse Missing Dependencies
        run: |
          echo "### ❌ Missing Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Required | Used By |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----------|---------|" >> $GITHUB_STEP_SUMMARY
      
          COUNT=$(xmllint --xpath "count(//MissingDependency)" fixed.xml)
      
          if [ "$COUNT" = "0" ]; then
            echo "No missing dependencies" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
      
          for i in $(seq 1 $COUNT); do
            TYPE=$(xmllint --xpath "string((//MissingDependency)[$i]/Required/@type)" fixed.xml)
            REQUIRED=$(xmllint --xpath "string((//MissingDependency)[$i]/Required/@displayName)" fixed.xml)
            DEPENDENT=$(xmllint --xpath "string((//MissingDependency)[$i]/Dependent/@displayName)" fixed.xml)
      
            echo "| $TYPE | $REQUIRED | $DEPENDENT |" >> $GITHUB_STEP_SUMMARY
          done
