---
name: Canvas App Lint

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      root:
        required: false
        default: src/appsource
        type: string
      lint-path:
        required: false
        default: .github/linters/pp-canvasapps-lint.json
        type: string
      fail-on-errors:
        required: false
        default: true
        type: boolean

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:

        # checkout
      - name: Checkout project repo
        id: checkout_project
        uses: actions/checkout@v4

        #checkout common
      - name: Checkout common lint repo
        id: checkout_common
        uses: actions/checkout@v4
        with:
          repository: gpjspr/gpj-common
          ref: main
          path: common

      
        # Optional download if run as subsequent job: ignore failure if the artifact doesn't exist
      - name: Try to download appsource artifact
        id: download_appsource
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: appsource
          path: src/appsource


        # ensure powershell exists
      - name: Ensure PowerShell
        id: ensure_psh
        run: |
          pwsh --version

        #run canvas app lint script
      - name: Run Canvas App Lint
        id: linter
        shell: pwsh
        run: |
          $root = "${{ inputs.root }}"
          $config = "./common/${{ inputs.lint-path }}"

          if (!(Test-Path $root)) {
            Write-Error "Root path '$root' does not exist"
            exit 1
          }

          if (!(Test-Path $config)) {
            Write-Error "Config path '$config' does not exist"
            exit 1
          }

          ./common/.github/linters/pp-canvasapps-lint.ps1 `
            -Root $root `
            -ConfigPath $config
            $exitCode = $LASTEXITCODE
            echo "exit_code=$exitCode" >> $env:GITHUB_OUTPUT

            exit 0

        # display summary
      - name: Display Summary
        id: display_summary
        if: always()
        shell: pwsh
        run: |
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          if (-not [string]::IsNullOrEmpty($summaryFile) -and (Test-Path $summaryFile)) {
              Write-Host "### Canvas App Lint Summary"
              Get-Content $summaryFile | ForEach-Object { Write-Host $_ }
          }
      
        # publish artifact
      - name: Upload full lint artifact
        id: publish_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-lint-full
          path: common/canvas-lint-full.md
      
        # do not fail if requested
      - name: Fail if requested
        if: ${{ inputs.fail-on-errors && steps.linter.outputs.exit_code != 0 }}
        run: exit 1
  

          
