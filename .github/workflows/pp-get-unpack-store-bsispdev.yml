---
name: Get Unpack Store from BUS-NOPS-DEV
permissions:
  contents: write
  id-token: write
on:
  workflow_call:
    inputs:
      solutionname:
        description: 'The power platform solution name'
        required: true
        type: string
      major:
        description: 'The major version (the first solution number). If left blank, the current major version will be used.'
        required: false
        type: string
      minor:
        description: 'The minor version (the second solution number). If left blank, the current minor version will be used.'
        required: false
        type: string
     
env:
  BUILD_VERSION: 1.0.0.0
  AZ_TENANT_ID: d3e62a06-7979-468d-a1a1-110e7c24c8d1
  AZ_CLIENT_ID: 3df7eaa5-11a5-4e72-9c44-04715669df8b
  PP_ENV_URL: https://impantcast.crm11.dynamics.com

jobs:
  export-solution:
    name: Export Solution
    runs-on: ubuntu-latest
    outputs:
      config_exists: ${{ steps.dev_settings_file.outputs.configexists }}
       
    steps:
      #check branch exist if not dev
      - name: Validate branch contains 'dev'
        run: |
          echo "Current branch: ${{ github.ref_name }}"

          if [[ "${{ github.ref_name }}" != *dev* ]]; then
            echo "::error title=Invalid branch::Branch must contain 'dev' to run this workflow"
            exit 1
          fi
    
       # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4

        # Azure login (OIDC)
      - name: Az CLI login
        id: az_authentiate
        uses: azure/login@v2
        with:
            # these need to be EDF items. Do not need to store as variables, are constant. Are not secrets
          client-id: ${{ env.AZ_CLIENT_ID }}
          tenant-id: ${{ env.AZ_TENANT_ID }}
          allow-no-subscriptions: true
     
      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"
       
      #Authenticate to Power Platform
      - name: PAC federated
        id: pac_authenticate
        shell: bash
        run: |
          pac auth create \
            --name "pacfed" \
            --githubFederated \
            --tenant ${{ env.AZ_TENANT_ID }} \
            --applicationId ${{ env.AZ_CLIENT_ID }} \
            --environment ${{ env.PP_ENV_URL }}
          pac auth who

      # check solution folder
      - name: Check Solution folder
        id: check_folders
        run: |
            mkdir -p src/exports/unmanaged
            mkdir -p src/exports/managed
            mkdir -p src/solutions/${{ inputs.solutionname }}
            mkdir -p configuration/DEV
            mkdir -p configuration/TEST
            mkdir -p configuration/UAT
            mkdir -p configuration/PROD

      #change version number
      - name: Change Version Number of Solution in BUS-NOPS-DEV
        id: change_build
        run: |
          pac solution list --json | head -n 5
          CURRENT_VERSION=$(pac solution list --json | jq -r '.[] | select(.SolutionUniqueName=="${{ inputs.solutionname }}") | .VersionNumber')
          echo "Current version: $CURRENT_VERSION"

          # Extract major and minor
          MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
          BUILD=$(echo $CURRENT_VERSION | cut -d. -f4)

          MAJOR_INPUT="${{ inputs.major }}"
          MINOR_INPUT="${{ inputs.minor }}"

          # Use input if provided, otherwise fallback to current
          if [ -z "$MAJOR_INPUT" ]; then
            MAJOR="$MAJOR"
          else
            MAJOR="$MAJOR_INPUT"
          fi

          if [ -z "$MINOR_INPUT" ]; then
            MINOR="$MINOR"
          else
            MINOR="$MINOR_INPUT"
          fi

          # Date in yymmdd
          CC=$(date +%y%m%d)

          # Incremental BUILD
         
          if [ "$PATCH" = "$CC" ]; then
            BUILD=$((BUILD + 1))
          else
            BUILD=1
          fi

          NEW_VERSION="$MAJOR.$MINOR.$CC.$BUILD"
          echo "Setting new solution version to: $NEW_VERSION"
          echo "BUILD_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "Global build is $BUILD_VERSION"

          # Set version
          pac solution online-version \
          --environment ${{ env.PP_ENV_URL }} \
          --solution-name "${{ inputs.solutionname }}" \
          --solution-version "$NEW_VERSION"
     
      # Export solution as a zip
      - name: Export Unmanaged Solution
        id: export_unamanged
        run: |
          pac solution export --path "./exports/unmanaged/${{ inputs.solutionname }}.zip" \
          --name "${{ inputs.solutionname }}" \
          --managed false \
          --overwrite

      - name: Export Managed Solution
        id: export_managed
        run: |
          pac solution export --path "./exports/managed/${{ inputs.solutionname }}.zip" \
          --name "${{ inputs.solutionname }}" \
          --managed true \
          --overwrite

      # Unpack unmanaged solution as code
      - name: Unpack Solution
        id: unpack_solution
        run: |
          pac solution unpack --zipfile "./exports/unmanaged/${{ inputs.solutionname }}.zip" \
          --folder "src/solutions/${{ inputs.solutionname }}" \
          --allowDelete true \
          --allowWrite
     # Check if configuration file exists
      - name: Ensure settings file exists
        id: dev_settings_file
        shell: pwsh
        run: |
          $environments = @("DEV","TEST","UAT","PROD")
          $configfileexists = $true
          foreach ($env in $environments) {
            $settingsPath = "configuration/$env/${{ inputs.solutionname }}-settings.json"
            
            if (-Not (Test-Path $settingsPath)) {
                Write-Host "Solution settings file not found in $env. Generating..."
                
                pac solution create-settings --solution-zip "./exports/unmanaged/${{ inputs.solutionname }}.zip" --settings-file $settingsPath
                $configfileexists = $false
            }
            else {
                Write-Host "Settings file already exists. Skipping generation."
            }
          }
           $configoutput=$configfileexists.ToString().ToLower()
           ## Write-Output "configexists=$configoutput" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
           Add-Content -Path $env:GITHUB_OUTPUT -Value "configexists=$configoutput"
      # check output
      - name: Debug outputs
        run: echo "Step output configexists=${{ steps.dev_settings_file.outputs.configexists }}"
        
      #install xmllint
      - name: Install xmllint
        id: install_xmllint_extract
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # Change managed flag in solution.xml for future build
      - name: Update Managed flag to Both
        id: update_solution_xml
        run: |
          SOLUTION_XML="src/solutions/${{ inputs.solutionname }}/Other/Solution.xml"

          echo "Before change:"
          xmllint --xpath "string(//Managed)" "$SOLUTION_XML"

          xmllint --shell "$SOLUTION_XML" <<EOF
          cd //Managed
          set Both
          save
          EOF

      #create solutionn.xml artifact for next job
      - name: Upload unpacked solution as artifact
        id: artifact_xml
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-solution
          path: src/solutions/${{ inputs.solutionname }}

      #create flow artifact for flows
      - name: Upload workflows
        id: artifact_workflows
        uses: actions/upload-artifact@v4
        with:
          name: appsource
          path: src/solutions/${{ inputs.solutionname }}/Workflows

      # Unpack the canvas app to source
      - name: Unpack canvas app to source
        id: unpack_canvasapps
        run: |
          set -euo pipefail

          # Path to unpacked solution
          SOL_PATH="src/solutions/${{ inputs.solutionname }}"
          
          # Temp directory for zips
          TMP_DIR="$(mktemp -d)"
          echo "Using temp directory: $TMP_DIR"
          
          # Loop over all .msapp files
          set +e
          while read -r MSAPP_FILE; do
            echo "Processing: $MSAPP_FILE"
        
            ZIP_FILE="$TMP_DIR/$(basename "$MSAPP_FILE" .msapp).zip"
        
            cp "$MSAPP_FILE" "$ZIP_FILE"
        
            PROP_JSON=$(unzip -p "$ZIP_FILE" "Properties.json" 2>/dev/null) || {
                echo "Properties.json not found in $MSAPP_FILE"
                continue
            }
        
            APP_NAME=$(echo "$PROP_JSON" | jq -r '.Name' 2>/dev/null || echo "")
            if [[ -z "$APP_NAME" || "$APP_NAME" == "null" ]]; then
                echo "Could not find 'Name' in Properties.json of $MSAPP_FILE"
                continue
            fi
        
            echo "App name: $APP_NAME"
        
            TARGET_DIR="src/appsource/$APP_NAME"
            mkdir -p "$TARGET_DIR"
        
            if unzip -t "$ZIP_FILE" >/dev/null 2>&1; then
                unzip -o "$ZIP_FILE" -d "$TARGET_DIR"
                UNZIP_EXIT=$?
                
                if [[ $UNZIP_EXIT -gt 1 ]]; then
                    echo "Unzip FAILED (code $UNZIP_EXIT) for $ZIP_FILE"
                    continue
                else
                    echo "Unzip completed (code $UNZIP_EXIT) for $ZIP_FILE"
                fi
                echo "Copied contents to $TARGET_DIR"
            else
                echo "Skipping invalid zip: $ZIP_FILE"
                continue
            fi
        
            rm -f "$ZIP_FILE"
        
          done < <(find "$SOL_PATH" -type f -name "*.msapp")
          set -e
          
          # Remove temporary directory
          rm -rf "$TMP_DIR"
          
          echo "Done!"

      #create canvas app artifact for lint
      - name: Upload appsource
        id: artifact_appsource
        uses: actions/upload-artifact@v4
        with:
          name: download-appsource
          path: src/appsource

      # commit the changes
      - name: Commit changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git status
          git diff --stat
          git commit -m "Automated extract of ${{ inputs.solutionname }}"

      # push to the repo
      - name: Push changes
        id: push_repo
        if: success()
        run: git push origin HEAD

  
  #update configuration job        
  update-configuration:
    name: Configuration Files
    runs-on: ubuntu-latest
    needs: export-solution
    if: needs.export-solution.outputs.config_exists == 'true'
    continue-on-error: true
       
    steps:
       # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_extract
        uses: actions/checkout@v4

             
      # Install PAC CLI
      - name: Install PAC CLI
        id: install_pac
        uses: microsoft/powerplatform-actions/actions-install@v1

      # Ensure PAC is available
      - name: Add PAC to PATH
        id: pac_path
        shell: bash
        run: |
          echo "$(dirname "${POWERPLATFORMTOOLS_PACPATH}")" >> "$GITHUB_PATH"

      # Create temporary settings file
      - name: Temporary Settings File
        shell: pwsh
        run: |
          $settingsPath = "configuration/${{ inputs.solutionname }}-settings.json"
          pac solution create-settings --solution-zip "./exports/unmanaged/${{ inputs.solutionname }}.zip" --settings-file $settingsPath
          
          $existingFile = "configuration/DEV/${{ inputs.solutionname }}-settings.json"
          $tempFile = "configuration/${{ inputs.solutionname }}-settings.json"
          
          $existing = Get-Content $existingFile -Raw | ConvertFrom-Json
          $new = Get-Content $tempFile -Raw | ConvertFrom-Json

          $added = @()
          $removed = @()
          $summaryFile = $env:GITHUB_STEP_SUMMARY
          
          foreach ($param in $new.EnvironmentVariables) {
              $match = $existing.EnvironmentVariables | Where-Object { $_.SchemaName -eq $param.SchemaName }
              if (-Not $match) {
                  $added += $param
                  Write-Host "::warning::New setting detected: $($param.SchemaName)"
                  $existing.EnvironmentVariables += $param
              }
          }

          foreach ($param in $existing.EnvironmentVariables) {
              if (-Not ($new.EnvironmentVariables | Where-Object { $_.SchemaName -eq $param.SchemaName })) {
                  Write-Host "::warning::setting removed: $($param.SchemaName)"
                  $removed += $param
              }
          }
      
          if ($added.Count -gt 0) {
            Add-Content $summaryFile "### 🟢 New Settings Detected"
            Add-Content $summaryFile "| SchemaName | DefaultValue |"
            Add-Content $summaryFile "|------------|-------------|"
            foreach ($param in $added) {
                $defaultVal = if ($param.DefaultValue) { $param.DefaultValue } else { "" }
                Add-Content $summaryFile "| $($param.SchemaName) | $defaultVal |"
            }
            Add-Content $summaryFile "`n"
            
            $existing | ConvertTo-Json -Depth 10 | Set-Content $existingFile
          }
          
          if ($removed.Count -gt 0) {
              Add-Content $summaryFile "### 🔴 Removed Settings Detected"
              Add-Content $summaryFile "| SchemaName | DefaultValue |"
              Add-Content $summaryFile "|------------|-------------|"
              foreach ($param in $removed) {
                  $defaultVal = if ($param.DefaultValue) { $param.DefaultValue } else { "" }
                  Add-Content $summaryFile "| $($param.SchemaName) | $defaultVal |"
              }
              Add-Content $summaryFile "`n"
          }

          if (($added.Count -gt 0) -or ($removed.Count -gt 0)) {
            Add-Content $summaryFile "### 🟠 Manually update the configuration files with values"
            Add-Content $summaryFile "`n"
          }
          
          

      - name: Commit configuration changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update DEV configuration file"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  #check dependencies
  check-dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    needs: export-solution
    continue-on-error: true
    
    steps:
    
      # Checkout the CALLING repo (not the shared repo)
      - name: Checkout repo
        id: check_repo_dependencies
        uses: actions/checkout@v4
    
      
      - name: Download unpacked solution
        id: download_solution_artifact
        uses: actions/download-artifact@v4
        with:
          name: unpacked-solution
          path: src/solutions/${{ inputs.solutionname }}
    
    
      #install xmllint
      - name: Install xmllint
        id: install_xmllint_dependencies
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    
      # Check solution for missing dependencies warn if found
      - name: Check solution.xml for missing dependencies
        id: check_dependencies
        shell: bash
        run: |
          SOLUTION_XML="src/solutions/${{ inputs.solutionname }}/Other/Solution.xml"
      
          if [[ ! -f "$SOLUTION_XML" ]]; then
            echo "::warning::solution.xml not found at $SOLUTION_XML"
            exit 0
          fi
      
          # Count missing dependencies
          MISSING_COUNT=$(xmllint --xpath 'count(//MissingDependencies/MissingDependency)' "$SOLUTION_XML" 2>/dev/null)
      
          if [[ "$MISSING_COUNT" -gt 0 ]]; then
            echo "::warning::Found $MISSING_COUNT missing dependencies in solution.xml"
      
            # Create a concise table: Dependent | Required
            echo "###  Missing Dependencies in ${{ inputs.solutionname }}" >> $GITHUB_STEP_SUMMARY
            echo "| Dependent | Required |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
      
            # Loop through each MissingDependency
            for i in $(seq 1 "$MISSING_COUNT"); do
              DEP=$(xmllint --xpath "string(//MissingDependencies/MissingDependency[$i]/Dependent/@displayName)" "$SOLUTION_XML" 2>/dev/null)
              REQ=$(xmllint --xpath "string(//MissingDependencies/MissingDependency[$i]/Required/@displayName)" "$SOLUTION_XML" 2>/dev/null)
              echo "| $DEP | $REQ |" >> $GITHUB_STEP_SUMMARY
              echo "  Dependent: $DEP, Required: $REQ"
            done
      
          else
            echo "No missing dependencies found in solution.xml"
          fi
